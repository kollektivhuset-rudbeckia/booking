{{define "content"}}
<div class="auth">
	<div class="auth-card">
		<img class="auth-mark" src="/static/rudbeckia.png" alt=""
		     width="64" height="64" decoding="async">
		<h1>{{.Site.Title}}</h1>
		<p class="muted">{{with siteTagline .Site}}{{.}}{{else}}{{t "login.lede"}}{{end}}</p>
		{{with .Data.Error}}<p class="alert alert-error" role="alert">{{.}}</p>{{end}}
		<form method="post" action="/login" class="stack">
			<input type="hidden" name="next" value="{{.Data.Next}}">
			<label for="password">{{t "login.password"}}</label>
			<input id="password" name="password" type="password" autocomplete="current-password"
			       required autofocus placeholder="••••••••"
			       {{if .Demo}}value="{{.DemoPass}}"{{end}}>
			<button type="submit" class="button primary">{{t "login.submit"}}</button>
		</form>
		{{if .Demo}}
		<p class="muted small">{{t "login.demo" .DemoAdmin}}</p>
		{{else}}
		<p class="muted small">{{t "login.where"}}</p>
		{{end}}
	</div>
</div>
{{end}}
{{template "base" .}}
