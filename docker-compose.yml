services:
  booking:
    image: ghcr.io/o5ten/booking:latest
    container_name: booking-rudbeckia
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # --- Required ---------------------------------------------------------
      BOOKING_PASSWORD: ${BOOKING_PASSWORD:?set BOOKING_PASSWORD in .env}
      BASE_URL: ${BASE_URL:-https://booking.rudbeckia.nu}

      # --- Optional ---------------------------------------------------------
      # Unlocks /admin, where every booking in the house is listed.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Keeps sessions alive across a password change if you set it yourself.
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # --- Mattermost -------------------------------------------------------
      # The bot that sends confirmations and looks up who is booking. Without
      # these the site still works; confirmations are only logged.
      MATTERMOST_URL: ${MATTERMOST_URL:-}
      MATTERMOST_TOKEN: ${MATTERMOST_TOKEN:-}
      # Usernames allowed to book. Empty means everyone in the directory.
      MATTERMOST_ALLOW: ${MATTERMOST_ALLOW:-}
    env_file: .env
    volumes:
      - booking-data:/data
      # Mount your own resource list over the one baked into the image.
      - ./config.yaml:/config.yaml:ro
    healthcheck:
      # The image has no shell, so call the binary's own health endpoint via
      # the container's IP from the outside instead of curl inside.
      test: ["CMD", "/booking", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  booking-data:
